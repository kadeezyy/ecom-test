[project]
name = "ecom-core"
version = "0.1.0"
description = "Ядро магазина цифровых товаров: заказы, платёжные вебхуки, автовыдача"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # async antipatterns
    "T20",      # no print in library code
    "RUF",
    "BLE",      # blind except
]
ignore = [
    "RUF001",   # кириллица в строках — намеренно
    "RUF002",
    "RUF003",
    "B008",     # Depends(...) в дефолтах — идиома FastAPI
    # N818 требует суффикс Error у всех исключений. Осознанно выключено:
    # доменные имена SupplierRefused / SupplierUnknown / OrderNotFound несут
    # смысл лучше, чем SupplierRefusedError, и стдлиб сам правилу не следует
    # (StopIteration, KeyboardInterrupt).
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]
"src/shop/worker/main.py" = ["T20"]
# Миграции — плотный DDL, перенос строк только вредит читаемости.
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
plugins = []
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["uvicorn.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "db: тест требует PostgreSQL (переменная TEST_DATABASE_URL)",
    "slow: длительный тест (гонки, бэкофф)",
]
filterwarnings = ["error::DeprecationWarning:shop.*"]
